    <radialGradient id="glow" cx="50%" cy="43%" r="50%"><stop offset="0" stop-color="#d4b46a" stop-opacity="0.75"/><stop offset="0.32" stop-color="#a45a3a" stop-opacity="0.24"/><stop offset="1" stop-color="#000000" stop-opacity="0"/></radialGradient>
    <linearGradient id="obelisk" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2a2226"/><stop offset="0.22" stop-color="#5b4a41"/><stop offset="0.5" stop-color="#d1b775"/><stop offset="0.78" stop-color="#4b3333"/><stop offset="1" stop-color="#17151a"/></linearGradient>
    <linearGradient id="goldline" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9f7440"/><stop offset="0.5" stop-color="#f1d58b"/><stop offset="1" stop-color="#8a5333"/></linearGradient>
