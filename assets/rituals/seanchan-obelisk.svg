<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Город Шончан и Обелиск Воли</title>
  <desc id="desc">Стилизованный тёмно-фэнтезийный вид шончанского города с высоким обелиском в центре церемониальной площади.</desc>
  <defs>
