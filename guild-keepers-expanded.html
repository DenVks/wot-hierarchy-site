<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --color-text-primary:#1f1f1f;--color-text-secondary:#555;--color-text-tertiary:#858585;
  --color-background:#f7f3eb;--color-background-secondary:#fffaf2;--color-background-tertiary:#f0e8dc;
  --color-border-tertiary:#dfd0bc;--color-border-secondary:#bda98e;--border-radius-md:10px;
  --font-sans:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
body{font-family:var(--font-sans);background:var(--color-background);color:var(--color-text-primary);line-height:1.45}
.wrap{max-width:1180px;margin:0 auto;padding:1.25rem 1rem 2rem}
h1{font-size:22px;font-weight:650;text-align:center;margin-bottom:4px}
h2{font-size:17px;font-weight:600;margin:16px 0 8px;color:var(--color-text-primary)}
.sub{font-size:12px;color:var(--color-text-secondary);text-align:center;margin-bottom:14px}
.tabs{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:14px;justify-content:center;position:sticky;top:0;background:linear-gradient(180deg,var(--color-background) 75%,rgba(247,243,235,.75));padding:8px 0;z-index:10}
.tab{font-size:11px;padding:6px 11px;border-radius:20px;border:0.5px solid var(--color-border-tertiary);background:var(--color-background-secondary);color:var(--color-text-secondary);cursor:pointer;font-family:inherit;transition:all .15s;white-space:nowrap}
.tab.active{background:#BA7517;color:#fff;border-color:#BA7517;box-shadow:0 2px 10px rgba(186,117,23,.18)}
.tab:hover:not(.active){border-color:var(--color-border-secondary);color:var(--color-text-primary)}
.pane{display:none}.pane.active{display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:8px}
.grid-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:8px}
.card{background:var(--color-background-secondary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:11px 13px;margin-bottom:8px;box-shadow:0 1px 0 rgba(0,0,0,.03)}
.card.compact{padding:9px 11px}
.label{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--color-text-tertiary);margin-bottom:4px}
.title{font-size:14px;font-weight:650;color:var(--color-text-primary);margin-bottom:3px}
.body{font-size:12px;color:var(--color-text-secondary);line-height:1.6}
.body b{color:var(--color-text-primary);font-weight:600}
.muted{color:var(--color-text-tertiary)}
.tag{font-size:10px;padding:2px 7px;border-radius:20px;display:inline-block;margin-right:4px;margin-bottom:3px;background:#F1EFE8;color:#5F5E5A}
.badge{font-size:10px;padding:2px 7px;border-radius:20px;display:inline-block;background:#FAEEDA;color:#704000;margin:2px 3px 2px 0}
.warn{background:#FCEBEB;color:#A32D2D}
.good{background:#E1F5EE;color:#085041}
.info{background:#E9F0FF;color:#3857A6}
.divider{height:0.5px;background:var(--color-border-tertiary);margin:12px 0}
ul.clean{padding-left:17px;margin-top:4px}
ul.clean li{font-size:12px;color:var(--color-text-secondary);padding:2px 0}
.org-box{padding:9px 14px;border-radius:10px;font-size:12px;font-weight:600;text-align:center;min-width:150px}
.org-line{width:2px;height:16px;background:var(--color-border-secondary);margin:0 auto}
.org-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;position:relative}
.org-col-inner{border:0.5px solid var(--color-border-secondary);border-radius:8px;padding:7px 11px;font-size:11px;text-align:center;min-width:125px;background:var(--color-background-secondary)}
.accordion{border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);margin-bottom:7px;overflow:hidden;background:var(--color-background-secondary)}
.acc-head{display:flex;align-items:center;gap:10px;padding:10px 13px;cursor:pointer;user-select:none}
.acc-head:hover{background:rgba(186,117,23,.06)}
.acc-avatar{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0;color:#fff}
.acc-title{font-size:13px;font-weight:650;color:var(--color-text-primary)}
.acc-sub{font-size:11px;color:var(--color-text-secondary);margin-top:1px}
.acc-toggle{font-size:12px;color:var(--color-text-tertiary);margin-left:auto;transition:transform .2s;flex-shrink:0}
.acc-toggle.open{transform:rotate(180deg)}
.acc-body{display:none;padding:0 13px 12px;border-top:0.5px solid var(--color-border-tertiary)}
.acc-body.open{display:block}
.kv-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.kv{background:var(--color-background-tertiary);border-radius:7px;padding:8px 10px;font-size:11px;color:var(--color-text-secondary);line-height:1.55}
.kv.full{grid-column:1/-1}
.kv b{color:var(--color-text-primary);font-weight:650}
.matrix{width:100%;border-collapse:collapse;background:var(--color-background-secondary);border-radius:10px;overflow:hidden;font-size:12px}
.matrix th,.matrix td{border:0.5px solid var(--color-border-tertiary);padding:8px 9px;vertical-align:top;text-align:left}
.matrix th{background:#FAEEDA;color:#412402;font-size:11px;text-transform:uppercase;letter-spacing:.04em}
.timeline{position:relative;margin-left:8px;padding-left:16px;border-left:2px solid #BA7517}
.tl-item{margin-bottom:10px;position:relative}
.tl-item:before{content:"";position:absolute;left:-22px;top:4px;width:10px;height:10px;background:#BA7517;border-radius:50%;border:2px solid var(--color-background)}
.note{border-left:3px solid #BA7517;background:#fffaf2;padding:10px 12px;border-radius:8px;font-size:12px;color:var(--color-text-secondary);margin-bottom:8px}
.footer-note{font-size:11px;color:var(--color-text-tertiary);text-align:center;margin-top:14px}
@media(max-width:720px){.kv-grid{grid-template-columns:1fr}.matrix{display:block;overflow-x:auto}.tabs{position:static}}
</style>
<style>
.auth-lock body{overflow:hidden}.auth-overlay{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;background:rgba(10,8,14,.88);backdrop-filter:blur(10px);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.auth-modal{width:min(420px,calc(100vw - 32px));border:1px solid rgba(201,169,97,.35);border-radius:18px;background:#18131d;color:#f7efd8;padding:26px;box-shadow:0 24px 80px rgba(0,0,0,.55)}.auth-kicker{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:#c9a961;margin-bottom:8px}.auth-modal h1{font-size:24px;margin:0 0 10px;text-align:left}.auth-text{font-size:13px;color:rgba(255,255,255,.72);margin-bottom:14px}.auth-form label{display:block;font-size:12px;margin:10px 0 6px;color:#e8d8aa}.auth-form input{width:100%;padding:11px 12px;border-radius:10px;border:1px solid rgba(201,169,97,.35);background:#0f0d16;color:#fff}.auth-form button{margin-top:12px;width:100%;border:0;border-radius:10px;padding:11px 12px;background:#ba7517;color:#fff;font-weight:600;cursor:pointer}.auth-error{min-height:18px;color:#ffb4b4;font-size:12px;margin:8px 0 0}.auth-sigil{display:none}
</style>

<script>
const DATA = {"council": [{"name": "Алейс Тарн","post": "Главный Хранитель · Ранг V","age": "70 лет, выглядит на 45","gender": "ж","color": "#BA7517","key": false,"faction": "Нейтральная — над схваткой","stance": "Сохранить город любой ценой; балансирует фракции, чтобы ни одна линия не стала самостоятельной властью.","desc": "Правит 25 лет. Создала большую часть нынешней структуры. Внешне — аккуратная женщина средних лет, двигается тихо, говорит коротко. Кристалл виден через тонкий шрам у правой ключицы. Глаза слишком спокойны для человека.","goal": "Сохранить Фар Мэддинг незаражённым от всех внешних иерархий любой ценой.","secret": "Лично санкционировала три полевых эксперимента с кристаллами; один из них — восточный лес. Знает реальный процент энергодренажа горожан.","hooks": "Встреча возможна только через протокол. Никогда не просит напрямую. Если игроки узнают её секреты — становятся проблемой.","lever": "Протокол отзыва кристалла; закрытая подпись на полевых экспериментах; личная лояльность части протокольной службы."},{"name": "Дерис Вохт","post": "Советник по Безопасности · Ранг IV","age": "55 лет, выглядит на 35","gender": "м","color": "#A32D2D","key": false,"faction": "Изоляционисты","stance": "Закрыть город, сократить внешние контакты, расследовать Кевона без публичного раскола.","desc": "Бывший полевой агент. Поймал агента Хрустального Трона в архиве 12 лет назад. Жёсткий, не злой — убеждён, что угроза постоянна.","goal": "Выявить контакт Рейна внутри Совета. Подозревает Кевона без доказательств.","secret": "Ведёт личный досье-реестр на всех членов Совета, включая Алейс. Для него это не предательство, а страховка.","hooks": "Может нанять партию для слежки, не называя имени объекта. Союзник против Рейна, опасный свидетель чужих секретов.","lever": "Внутренняя Контрразведка, городская Стража, допросные протоколы, право закрытого наблюдения."},{"name": "Аурин Пал","post": "Советник по Кристаллотехнике · Ранг IV","age": "80 лет, выглядит на 50","gender": "ж","color": "#EF9F27","key": false,"faction": "Нейтральная — технократ","stance": "Не защищает режим как политику; защищает систему как инженерное достижение.","desc": "Архитектор нынешней кристалл-системы. Академический ум, говорит цифрами. Любит Гильдию не как институт власти, а как инженерный проект своей жизни.","goal": "Модернизировать энергосеть — убеждена, что текущая теряет до 15% КПД.","secret": "Знает точный процент дренажа горожан. Считает публичное раскрытие смертельным для Гильдии.","hooks": "Единственная, кто даст реальную экспертизу необычному кристаллу. Задания по поиску артефактов Первой Эпохи.","lever": "Допуск к лабораториям имплантации, техническая экспертиза кристаллов, архив проектных схем."},{"name": "Гвер Амаласан","post": "Советник по Аномалиям и Архивам · Ранг IV","age": "50 лет, выглядит на 35","gender": "м","color": "#1D9E75","key": true,"faction": "Прагматики","stance": "Осторожная реформа через доказательства; готов к аудиту Главного Хранителя, но боится преждевременного удара.","desc": "Спокойный и педантичный архивист по темпераменту, ставший следователем по необходимости. Умеренная речь скрывает острый аналитический склад. Орена Амаласан — тётка, погибшая в 229 ПБ на седьмом подземном уровне Белой Башни при невыясненных обстоятельствах.","goal": "Собрать достаточно доказательств для аудита Главного Хранителя V ранга — без преждевременного предупреждения. Работает параллельно официальной следственной линии.","secret": "Ведёт скрытую переписку с Бертаной до Аврин, главой Красной Аджи. Она предоставляет внешние данные об операциях Рейна в обмен на архивные записи Гильдии 215–235 ПБ.","hooks": "Единственный Советник, знающий, что Ирван Тосс делает в поле на самом деле. Может стать посредником между партией и Гильдией при разрешении дела Рейна.","lever": "Архивные допуски, скрытые курьеры, личный мотив по делу Орены Амаласан, аналитики аномалий."},{"name": "Лорис Сэйн","post": "Советник по Академии · Ранг IV","age": "65 лет, выглядит на 42","gender": "ж","color": "#7F77DD","key": false,"faction": "Прагматики — де-факто лидер","stance": "Гильдия должна привлекать таланты извне, иначе станет музейной машиной, пожирающей собственный город.","desc": "Умнейший политик на Совете, маскирующийся под академика. Верит, что Гильдия должна привлекать таланты извне. Дерис её ненавидит. Алейс держит в Совете именно потому, что слишком умна для оппозиции.","goal": "Расширить Академию и сделать её привлекательной для внешних специалистов.","secret": "Неофициальная переписка с учёным из Единой Воли Шары. Чисто академический обмен — но Дерис это не разграничивает.","hooks": "Покровитель для интеллектуальных классов. Задания по поиску утраченных текстов Первой Эпохи. Знает о партии больше, чем показывает.","lever": "Академия, кадетский корпус, публичные лекции, доступ к молодым специалистам."},{"name": "Маэль Дорин","post": "Советник по Инфраструктуре · Ранг IV","age": "70 лет, выглядит на 45","gender": "м","color": "#5F5E5A","key": false,"faction": "Нейтральный — аполитичный технократ","stance": "Системы должны работать. Политика вторична, пока не угрожает башням, каналам и накопителям.","desc": "Тихий. Большинство горожан не знают, кто он. Контролирует всё физическое: башни антимагии, кристалл-каналы, инфраструктуру.","goal": "Поддерживать системы. Не строит интриги. Не нужно.","secret": "Обнаружил в подземных каналах под старым кварталом структуры, не совпадающие ни с одним архивным проектом. Молчит — пока не разобрался.","hooks": "Нейтральный источник о городских системах. Может дать доступ в подземелья. Единственный, кто знает карту всех кристалл-каналов.","lever": "Карта каналов, доступ к Башням Стража, ремонтные бригады, подземные разрешения."},{"name": "Сэрин Квол","post": "Советник по Алхимии · Ранг IV","age": "55 лет, выглядит на 38","gender": "ж","color": "#854F0B","key": false,"faction": "Прагматик-оппортунист","stance": "Стабильность требует запасов, запасов требует рынок; если Совет не понимает экономики, лаборатория понимает.","desc": "Контролирует весь алхимический арсенал. Деловой характер. Имеет неофициальные договорённости с торговыми домами — не коррупция, скорее предпринимательский импульс.","goal": "Монополизировать производство алхимических компонентов в нейтральной зоне.","secret": "Продаёт миноритарные партии эликсиров на внешний рынок через посредников. Рейн, возможно, знает.","hooks": "Может продать редкие компоненты. Её посредники — ниточка к торговым домам Шончан.","lever": "Склады, лаборатории, серые торговые посредники, контроль над алхимическим снаряжением."},{"name": "Кевон Маэль","post": "Советник по Внешним Связям · Ранг IV","age": "50 лет, выглядит на 35","gender": "м","color": "#D85A30","key": false,"faction": "⚠ Неизвестна — предположительно Хрустальный Трон","stance": "Официально — расширить дипломатическое присутствие. Неофициально — обеспечить внешний доступ к данным о Гильдии.","desc": "Обаятельный дипломат. Управляет сетью полевых агентов. Отправил Рейна на Поле Меррилор в обход Ирвана Тосса. Либо административная ошибка, либо умысел.","goal": "Видимая: расширить дипломатическое присутствие. Возможная: обеспечить Трону доступ к данным об аномалиях.","secret": "Три года назад Рейн получил доступ к устаревшему шаблону Гильдии, существовавшему только в двух местах. Один из них — кабинет Кевона. Ирван это знает. Гвер это знает.","hooks": "Антагонист второго плана. Полезен и дружелюбен при личной встрече. Арест без доказательств — политическая катастрофа.","lever": "Полевые агенты, внешние маршруты, дипломатические архивы, доступ к торговым домам."},{"name": "Вэрис Тох","post": "Советник по Квотам · Ранг IV","age": "75 лет, выглядит на 48","gender": "ж","color": "#412402","key": false,"faction": "Изоляционисты — холодный экономист","stance": "Эффективность выше сострадания. Если город выживает, система моральна.","desc": "Контролирует Автономный Совет Квот и реальное распределение энергии. Де-факто второй человек в Гильдии после Алейс. Считает эффективность единственной настоящей моралью.","goal": "Не допустить направления энергии на внешние проекты.","secret": "Один квартал получает на 8% больше дренажа. Там живут семьи чиновников, голосующих против её позиции.","hooks": "Самый опасный враг, которого игроки никогда не воспримут как угрозу. Единственный путь к данным энергосети.","lever": "Совет Квот, закрытые расчёты, реестр дренажа, право аварийного перераспределения."}],"relations": [{"pair": "Алейс Тарн ↔ Вэрис Тох","type": "Старый управленческий союз","tension": "Вэрис знает реальные цифры дренажа и понимает, где Алейс нарушала публичные обещания.","use": "Если Вэрис решит, что Алейс стала угрозой эффективности, именно она первой сможет обездвижить Главного Хранителя через квоты."},{"pair": "Алейс Тарн ↔ Аурин Пал","type": "Соавторы системы","tension": "Аурин знает техническую цену кристалл-сети, но не считает себя политиком.","use": "Аурин — лучший свидетель против Алейс, но её нужно убедить, что правда не уничтожит её главный труд."},{"pair": "Гвер Амаласан ↔ Дерис Вохт","type": "Взаимное уважение без доверия","tension": "Дерис подозревает Гвера в опасных внешних контактах, но ценит его аналитический ум.","use": "Партия может стать мостом между ними или причиной полного разрыва следственной линии."},{"pair": "Гвер Амаласан ↔ Ирван Тосс","type": "Скрытая полевая линия","tension": "Ирван действует в обход Кевона, но каждое сообщение Гверу повышает риск раскрытия.","use": "Через Ирвана партия входит в настоящую, а не официальную структуру расследования."},{"pair": "Кевон Маэль ↔ Сэрин Квол","type": "Деловое прикрытие","tension": "Кевон знает о серых поставках Сэрин, а Сэрин подозревает, что его внешние маршруты не полностью гильдейские.","use": "Один может сдать другого, если партия правильно покажет цену молчания."},{"pair": "Лорис Сэйн ↔ Дерис Вохт","type": "Идеологические противники","tension": "Лорис хочет внешних студентов и научный обмен; Дерис видит в этом открытую дверь для врагов.","use": "Любой инцидент с чужаком в Академии становится оружием против Лорис."},{"pair": "Маэль Дорин ↔ Гвер Амаласан","type": "Технический союз молчания","tension": "Маэль сообщил Гверу о структурах под старым кварталом раньше, чем Алейс.","use": "Они могут открыть партии подземный маршрут, но только если поверят, что игроки не служат Кевону."},{"pair": "Вэрис Тох ↔ Совет Квот","type": "Формальная власть / фактическая автономия","tension": "Совет Квот не является личной собственностью Вэрис и может заблокировать даже её решение.","use": "Внутри Совета Квот можно найти меньшинство, готовое говорить с партией."}],"divisions": [{"name": "Академия Хранителей","tag": "Образование / Исследования","color": "#7F77DD","desc": "Принимает детей от 10 лет. Конкурентная среда: лучшие выпускники получают ранг Офицера, худшие становятся горожанами с кристаллом без ранга.","role": "Фабрика кадров Гильдии и публичный фасад технократического будущего.","size": "~300 студентов, ~40 преподавателей.","leader": "Лорис Сэйн","hook": "В архивах Академии есть закрытые отчёты о полевых экспериментах и списки неудачных имплантаций."},{"name": "Корпус Полевых Агентов","tag": "Разведка / Внешние операции","color": "#E24B4A","desc": "Агенты под прикрытием по всему миру. Формально под управлением Кевона Маэля. Ирван Тосс — один из немногих агентов III ранга.","role": "Сбор данных об аномалиях, маршрутах иерархий и угрозах нейтралитету.","size": "~50 активных агентов, ~100 законсервированных контактов.","leader": "Кевон Маэль","hook": "Командная цепочка скомпрометирована. Часть агентов работает через Гвера, не через Кевона."},{"name": "Инженерный Корпус","tag": "Инфраструктура / Кристалл-системы","color": "#BA7517","desc": "Башни антимагии, подземные каналы, городские узлы и имплантационные мастерские.","role": "Физическая поддержка города. Без него Гильдия превращается в Совет без тела.","size": "~400 человек; присутствует в каждом квартале.","leader": "Маэль Дорин / Аурин Пал","hook": "Под старым кварталом найдены структуры, которых нет ни на одной официальной схеме."},{"name": "Алхимическая Лаборатория","tag": "Производство / Снаряжение","color": "#0F6E56","desc": "Эликсиры, кристалл-заряды, компоненты экзоскелетов, компенсаторы дренажа и ограниченные боевые смеси.","role": "Снабжение Гильдии и городского периметра.","size": "~80 алхимиков, ~60 техников.","leader": "Сэрин Квол","hook": "Есть внеучётная линия производства, связанная с внешними торговыми домами."},{"name": "Стража Хранителей","tag": "Безопасность / Городская оборона","color": "#A32D2D","desc": "Городская армия и полиция. Два крыла: Внешняя Стража и Внутренняя Контрразведка.","role": "Оборона, досмотр, подавление беспорядков, охота на агентов.","size": "~600 внешней стражи, ~30 контрразведчиков.","leader": "Дерис Вохт","hook": "Имеет досье на всех чужаков в городе, включая партию."},{"name": "Архив Гильдии","tag": "Данные / Память организации","color": "#378ADD","desc": "Три уровня доступа: открытый, служебный и закрытый. Закрытый уровень хранит активные операции и старые эксперименты.","role": "Институциональная память, доказательства, шантажный материал.","size": "~15 архивистов; круглосуточная охрана.","leader": "Гвер Амаласан","hook": "Именно здесь Ирван обнаружил утечку шаблона. Закрытый уровень — цель любого серьёзного агента."}],"affiliates": [{"name": "Автономный Совет Квот","tag": "Внутренний аффилиат · полунезависимый","color": "#BA7517","desc": "Семь членов, назначаемых по сложной процедуре. Формально связан с Вэрис Тох, но в оперативных решениях может блокировать даже Совет Девяти.","tension": "Может заморозить энергопоставки Совету. Это не политический орган, но именно он способен остановить власть физически."},{"name": "Белая Нить","tag": "Внешний аффилиат · гражданская сеть","color": "#0F6E56","desc": "Сеть жителей приграничных деревень, ведущих реестры пропавших и фиксирующих аномалии. Большинство участников не знает, что их данные иногда уходят в Гильдию.","tension": "Белая Нить зафик ank": "Ранг III","superior": "Аурин Пал","motive": "Снизить число неудачных имплантаций, даже если придётся нарушить отчётность.","knows": "Какие серии кристаллов дают задержанные побочные эффекты.","use": "Может лечить кристалл-сбои партии или обнаружить поддельный имплант."},{"name": "Роэн Мал","role": "Смотритель западной Башни Стража","rank": "Ранг II","superior": "Маэль Дорин","motive": "Не дать башне стать политическим инструментом.","knows": "Одна башня работает не по проектной схеме и иногда принимает энергию не из городского контура.","use": "Ведёт к техническому расследованию подземных структур."}],"locations": [{"name": "Зал Распределения","district": "Центральный административный пояс","public": "Заседания Совета, публичные декларации, церемонии ранга.","hidden": "Под залом расположен центральный накопитель и аварийный контур перераспределения.","controller": "Алейс Тарн / Вэрис Тох","security": "Протокольная стража, кристалл-замки, журнал входов, скрытая система глушения имплантов.","scene": "Заседание Совета, где партия приносит доказательство и наблюдает, как каждый голос становится угрозой."},{"name": "Дом Квот","district": "Квартал счёта и мер","public": "Учёт энерговзносов, перерасчёт квартальных норм, выдача компенсационных пайков.","hidden": "Закрытый реестр реального дренажа и список кварталов с принудительным повышением норм.","controller": "Вэрис Тох / Нем Тарвик","security": "Бухгалтерские печати, двойной реестр, стража без формы, архивариусы квот.","scene": "Тихая кража цифр, которая опаснее ограбления казны."},{"name": "Архив Нижнего Уровня","district": "Под Залом Распределения","public": "Не существует для граждан; официально это техническое хранилище.","hidden": "Данные 215–235 ПБ, дело Орены Амаласан, утечка шаблона, отчёты о старых экспериментах.","controller": "Гвер Амаласан","security": "Три уровня допуска, архивные замки, стража Дериса на внешнем периметре.","scene": "Спуск за одной папкой, после которого партия понимает, что ищет не тет, научный обмен только через утверждённые каналы.","real": "Единство хочет понять, можно ли совместить кристалл-сеть с собственной Иерархией без зоны Стража.","npc": "Лорис готова к обмену; Дерис считает это угрозой; Аурин хочет данные."},{"force": "Хрустальный Трон","official": "Дипломатическая дистанция, торговые контакты через посредников.","real": "Трону нужен шаблон кристалл-иерархии и способ проникновения в город без направляющих.","npc": "Кевон — главный подозреваемый канал; Сэрин может быть непреднамеренным соучастником."},{"force": "Красная Аджа","official": "Недоверие: Фар Мэддинг не любит направляющих, Красная Аджа не любит скрытых технологий контроля.","real": "Бертана до Аврин обменивается с Гвером данными по Рейну и архивам 215–235 ПБ.","npc": "Гвер рискует карьерой; Дерис уничтожит его, если узнает не вовремя."},{"force": "Орден Стражей Узора","official": "Ситуативное сотрудничество по аномалиям.","real": "Орден может потребовать открыть данные по восточному лесу и забрать кристалл под свой контроль.","npc": "Гвер склонен сотрудничать; Алейс склонна скрыть; Маэль хочет технический доступ."},{"force": "Белая Нить","official": "Гражданская сеть без политического веса.","real": "Единственные, кто хранит человеческие имена за статистикой пропавших.","npc": "Тэрис Молл может стать лицом этой линии."},{"force": "Торговые дома","official": "Экономическая необходимость нейтрального города.","real": "Слой, через который движутся эликсиры, поддельные документы и внешние агенты.","npc": "Сэрин, Кевон и посредники делят этот узел между собой."}],"timeline": [{"year": "0–20 ПБ","official": "Фар Мэддинг восстанавливается как убежище вне Единой Силы.","secret": "Старые городские элиты начинают собирать запретные сведения о довоенной технике."},{"year": "30–50 ПБ","official": "Создаются первые технические школы и усиливается контроль границ.","secret": "Формируется закрытый кружок инженеров, позже ставший ядром Гильдии."},{"year": "60–90 ПБ","official": "Принят Ус принимал действий — ждал подтверждения через внешний канал. Теперь оба знают слишком много, чтобы действовать официально."},{"icon": "📜","title": "Письмо Бертаны","sub": "Гвер и Красная Аджа","type": "Внешняя интрига","body": "Гвер получает письма от Бертаны до Аврин через третьи руки. Она даёт ему внешние данные об операциях Рейна; он открывает ей архивные записи 215–235 ПБ. Если партия перехватывает письмо, она получает не улику, а ключ к мотивам Гвера."},{"icon": "⚗️","title": "Кристалл в восточном лесу","sub": "Эксперимент, который пошёл не так","type": "Тайна","body": "12 лет назад Гильдия установила полевой кристалл. Он начал абсорбировать людей. Белая Нить зафиксировала. Алейс санкционировала эксперимент лично. Уничтожить кристалл, передать Ордену или раскрыть семьям — разные виды катастрофы."},{"icon": "📊","title": "Правда о квотах","sub": "Горожане не знают, сколько с них берут","type": "Моральная дилемма","body": "Официально дренаж — 5–8%. Реально — 15–20%. Аурин и Вэрис знают. Алейс никогда не опровергала. Если партия получит цифры, вопрос станет не «сказать или скрыть», а «какой ценой правда»."},{"icon": "🗝️","title": "Что под старым кварталом","sub": "Структуры Первой Эпохи","type": "Исследование","body": "Маэль Дорин обнаружил структуры, которых не должно быть. Гвер в курсе — Маэль сообщил ему первому, не Алейс. Подземелье под городом может изменить понимание того, что такое Страж на самом деле."},{"icon": "⚔️","title": "Раскол Совета: следующий голос","sub": "4 против 4","type": "Политика / длинная дуга","body": "Дерис и Вэрис против открытия. Гвер и Лорис — за прагматичное сотрудничество. Кевон — неизвестно. Маэль, Аурин и Сэрин качнутся при кризисе. Если Кевон разоблачён до голосования, расстановка меняется полностью."}],"rumors": ["В западной Башне Стража иногда горит свет после закрытия смены, но смотритель клянётся, что там никого нет.","В Санатории Компенсаторов есть палата без номера, куда не пускают даже родственников.","Студенты Академии говорят, что худшие выпускники не проваливаются — их просто переводят в места, которых нет на карте.","Один квартальный смотритель умеет снижать норму дренажа, но берёт плату не монетой, а услугами.","В доме Кевона три года назад меняли полы. Старые доски вывезли ночью.","Белая Нить ведёт список имён, которые Гильдия называет ошибками учёта.","Аурин Пал однажды сказала: «Система работает. Вопрос только — для кого». После этого её перестали приглашать на публичные лекции.","Вэрис Тох не повышает голос. Никогда. Даже когда подписывает разрушительные решения.","Некоторые кристаллы после смерти владельца ещё сутки отдают тепло.","В старом квартале каналов слышен гул, совпадающий с пульсом человека, если приложить ухо к камню."],"coverage": [{"domain": "Юрисдикция и право доступа","publicScope": "Внутри Фар Мэддинга Гильдия действует как техническая власть: выдаёт допуски, закрывает кварталы, ограничивает маршруты чужаков и определяет режим доступа к объектам.","hiddenScope": "Реальная юрисдикция шире городской стены: через агентов, Белую Нить, торговые дома и закрытые миссии Гильдия контролирует сведения об угрозах на сотни и тысячи миль.","controllers": "Алейс Тарн, Дерис Вохт, Кевон Маэль","instruments": "пропуска, поручители, журналы входа, досье Контрразведки, дипломатические коридоры","limits": "Гильдия не может открыто править чужими территориями; вне города она действует через посредников, слухи, экспедиции и договоры.","scene": "Партия получает законный пропуск только на один квартал, но обнаруживает, что за пределами пропуска уже ведётся скрытая миссия Гильдии."},{"domain": "Страж и зона вне Единой Силы","publicScope": "Башни Стража поддерживают уникальную защиту Фар Мэддинга: город воспринимается как место, где направляющие теряют привычные рычаги силы.","hiddenScope": "Часть башен связана с неучтёнными подземными каналами. Не вся система построена самой Гильдией; часть её опирается на более древнюю инфраструктуру.","controllers": "Маэль Дорин, Аурин Пал, Алейс Тарн","instruments": "Башни Стража, силовые запоры, аварийные контуры, карты каналов, ремонтные бригады","limits": "Сбой даже одной башни создаёт политическую панику; полное отключение нельзя скрыть дольше нескольких минут.","scene": "На несколько секунд в городе вновь ощущается Источник, и все стороны начинают искать виновного раньше, чем инженер успевает назвать причину."},{"domain": "Кристаллы жизни и ранговая система","publicScope": "Кристаллы жизни дают гражданам место в городской системе, а ранговые импланты определяют доступ, профессию и обязанность перед Гильдией.","hiddenScope": "Имплант — не только знак статуса. Он является каналом учёта, дренажа, командного доступа, медицинского наблюдения и, в крайних случаях, наказания.","controllers": "Аурин Пал, Алейс Тарн, Лейр Осс","instruments": "имплантационные мастерские, реестр серий, протокол отзыва, хирургические шлюзы, компенсаторы","limits": "Слишком грубый отзыв кристалла создаёт кристалл-призрак; публичное раскрытие механики отзыва разрушит доверие к ранговой системе.","scene": "NPC просит не повысить его ранг, а удалить имплант до того, как Совет узнает, что он слышит чужие импульсы."},{"domain": "Энерговзносы, квоты и распределение","publicScope": "Горожане знают, что город требует энергии для защиты, башен, компенсаций и обслуживания систем.","hiddenScope": "Реальный дренаж выше публичной нормы. Совет Квот хранит двойные реестры и способен физически остановить власть, заморозив распределение.","controllers": "Вэрис Тох, Нем Тарвик, Автономный Совет Квот","instruments": "публичный реестр, служебный реестр, квартальные нормы, компенсационные пайки, аварийное перераспределение","limits": "Квоты нельзя резко снизить без риска для башен; нельзя резко повысить без риска бунта и медицинского коллапса.","scene": "Цифры показывают, что один квартал платит больше не из-за нужды, а из-за старого политического наказания."},{"domain": "Безопасность, Стража и Контрразведка","publicScope": "Стража Хранителей охраняет стены, ворота, архивы, склады и порядок в городе.","hiddenScope": "Внутренняя Контрразведка ведёт досье на чужаков, Советников, а иногда и на собственных агентов.","controllers": "Дерис Вохт, Калем Руд, Сиана Трейс","instruments": "допросные протоколы, внешняя стража, скрытое наблюдение, реестры маршрутов, право закрытого сопровождения","limits": "Дерис может задержать почти любого, но не может публично обвинить Советника без доказательств.","scene": "Партия понимает, что её допрашивают не о преступлении, а о том, кто из Советников первым вышел с ней на связь."},{"domain": "Академия и кадровый отбор","publicScope": "Академия Хранителей обучает инженеров, офицеров, архивистов и администраторов Гильдии.","hiddenScope": "Академия оценивает не только талант, но и лояльность, психологическую податливость и пригодность к имплантации.","controllers": "Лорис Сэйн, преподаватели II–III ранга, кадетские старосты","instruments": "экзамены, рекомендации, закрытые аудитории, психологические протоколы, ранговые перспективы","limits": "Слишком открытая Академия даст врагам доступ к системе; слишком закрытая — убьёт приток талантов.","scene": "Кадет просит вывести его из Академии: он провалил не экзамен, а тест на управляемость."},{"domain": "Алхимия, снабжение и серый рынок","publicScope": "Лаборатория Квол производит компенсаторы, реагенты, эликсиры, кристалл-заряды и технические смеси.","hiddenScope": "Часть продукции уходит через серые маршруты. Для Сэрин это запас прочности, для Дериса — потенциальная измена.","controllers": "Сэрин Квол, складские мастера, торговые посредники","instruments": "лабораторные склады, алхимические печати, карантинные зоны, торговые дома, внешние накладные","limits": "Без серого рынка Гильдия теряет реагенты; с серым рынком она открывает канал для шантажа и проникновения.","scene": "На найденном у врага эликсире стоит маркировка партии, которой официально никогда не существовало."},{"domain": "Архивы, память и доказательства","publicScope": "Архив хранит историю Гильдии, городские решения, отчёты, карты и служебные записи.","hiddenScope": "Закрытые уровни содержат не историю, а власть: старые эксперименты, компромат, дело Орены, данные Рейна и подписи Алейс.","controllers": "Гвер Амаласан, Элвин Норр, архивная охрана","instruments": "три уровня доступа, закрытые шкафы, журналы выдачи, скрытые копии, внешняя переписка","limits": "Архивная правда может разрушить город быстрее любой аномалии, если выйдет без политического плана.","scene": "Партия приходит за одной папкой, но находит пустое место, где должна лежать вторая версия того же отчёта."},{"domain": "Аномалии, археология и полевые данные","publicScope": "Гильдия официально наблюдает опасные зоны и собирает сведения, необходимые для безопасности Фар Мэддинга.","hiddenScope": "Полевые данные используются для политики, экспериментов и торговли информацией. Не все объекты являются аномалиями: часть — древние археологические узлы.","controllers": "Гвер Амаласан, Кевон Маэль, Маэль Дорин, Аурин Пал","instruments": "полевые агенты, Белая Нить, каталоги PoI, протоколы рейтингов R и АРХ, образцы, отчёты","limits": "Гильдия не может исследовать всё сама; ей приходится выбирать между безопасностью, секретностью и скоростью.","scene": "Отчёт Белой Нити о пропавших приходит раньше, чем официальный полевой агент получает приказ признать объект существующим."},{"domain": "Внешняя сеть и дипломатические каналы","publicScope": "Дом Внешних Сношений регистрирует послов, караваны, договоры, научные контакты и торговые маршруты.","hiddenScope": "Через те же каналы ходят полевые агенты, поддельные документы, письма Бертаны, маршруты Рейна и интерес Хрустального Трона.","controllers": "Кевон Маэль, Мирена Дол, Савен Кор, Гвер Амаласан","instruments": "караванные листы, дипломатические комнаты, шифры, посредники, торговые дома, закрытые курьеры","limits": "Каждый внешний канал нужен Гильдии и одновременно является потенциальной дырой в её обороне.","scene": "Один шончанский оборот вшаяся через древнюю структуру.","guildUse": "Самый спорный класс: Советники могут спорить, считать ли объект научным, военным или политическим."},{"class": "OP · Операционный объект","meaning": "Зона, где опасность уже включена в текущую политику Гильдии: карантин, эксперимент, закрытый доступ или стратегический узел.","guildUse": "Обычно связан с Алейс, Дерисом, Вэрис или закрытой цепочкой приказов."}],"ranks": [{"level": "Без ранга","title": "Гражданин-энерговзносчик","who": "Обычный житель Фар Мэддинга, включённый в городской контур через гражданский кристалл жизни.","crystal": "Гражданский кристалл жизни: малый имплант под ключицей, у запястья или в грудной клетке; не даёт служебного усиления, но фиксирует норму взноса и состояние носителя.","receives": "Право жить внутри защищённого контура, доступ к пайкам, квартальной медицине, санаториям компенсаторов, городским мастерским и защите Башен Стража.","energyCost": "Базовый регулярный дренаж: тепло тела, пульс, часть восстановительного ресурса после сна и физического труда. Публично — 5–8%; в неблагоприятных кварталах может быть выше.","serviceObligation": "Соблюдать квартальные нормы, являться на проверки кристалла, сообщать о сбоях, не укрывать людей без регистрации и выполнять аварийные распоряжения смотрителя квартала.","risks": "Хроническая усталость, туман в голове, повышенные нормы, перевод семьи в квартал усиленного дренажа, отказ в компенсации при сокрытии сбоя.","permissions": "Нет служебных полномочий. Может обращаться в Дом Квот, санаторий или квартальную управу, но почти всегда через смотрителя.","gameUse": "Показывает человеческую цену системы: семья, которая не восстаёт, но уже не может жить без компенсаторов."},{"level": "Ранг I","title": "Кадет / младший служащий","who": "Ученик Академии, младший техник, писарь, курьер, стажёр лаборатории или кандидат в Стражу.","crystal": "Учебный ранговый кристалл: уже связан с малым служебным контуром, но имеет ограничитель перегрузки и журнал дисциплинарных   ["overview","Обзор"], ["coverage","Охват Гильдии"], ["ranks","Ранги / Кристаллы"], ["council","Совет Девяти"], ["relations","Связи"], ["divisions","Подразделения"],

  ["external","Внешние связи"], ["secrets","Секреты / кампания"]
];
const $ = (id)=>document.getElementById(id);
function esc(s){return String(s ?? '').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function initials(name){return name.split(' ').map(w=>w[0]).join('').slice(0,2);}
function factionClass(f){ if((f||'').includes('Изол')||(f||'').includes('⚠')) return 'warn'; if((f||'').includes('Праг')) return 'good'; return ''; }
function tags(...items){return items.filter(Boolean).map(x=>`<span class="tag ${factionClass(x)}">${esc(x)}</span>`).join('');}
function acc(id, color, title, sub, body, avatar){
  return `<div class="accordion"><div class="acc-head" onclick="toggleAcc('${id}')"><div class="acc-avatar" style="background:${esc(color||'#BA7517')}">${esc(avatar||initials(title))}</div><div><div class="acc-title">${esc(title)}</div><div class="acc-sub">${sub}</div></div><div class="acc-toggle" id="t_${id}">▾</div></div><div class="acc-body" id="b_${id}">${body}</div></div>`;
}
function toggleAcc(id){
  const b=$('b_'+id), t=$('t_'+id); if(!b||!t) return;
  const open=b.classList.contains('open');
  b.classList.toggle('open',!open); t.classList.toggle('open',!open);
}
function initTabs(){
  $('tabs').innerHTML = PANES.map(([id,label],i)=>`<button class="tab ${i===0?'active':''}" onclick="switchTab('${id}')">${esc(label)}</button>`).join('');
}
function switchTab(id){
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active', PANES[i][0]===id));
  document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('active', p.id===id));
  window.scrollTo({top:0,behavior:'smooth'});
}
